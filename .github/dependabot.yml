# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      paperback:
        patterns:
          - "@paperback/toolchain"
          - "@paperback/types"
          - "@paperback/runtime-polyfills"
      minor-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major

  # Actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
