name: Delete Branch Extensions

on:
  delete:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  delete-branch-ext:
    name: Delete Branch Extensions
    # On a delete event `github.ref` is the default branch; the deleted one is
    # `github.event.ref`. Only release branches (`0.9/stable`) deploy anything.
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      # Passed through the environment, never interpolated into a script: a branch
      # name is user input and may contain shell syntax.
      DELETED_BRANCH: ${{ github.event.ref }}
    steps:
      - name: Check branch pattern
        id: pattern
        run: |
          if [[ "$DELETED_BRANCH" =~ ^[0-9]+\.[0-9]+/[^/]+$ ]]; then
            echo "deploys=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release branch: $DELETED_BRANCH"
          fi
      - name: Checkout Branch
        if: steps.pattern.outputs.deploys == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: "gh-pages"
      - name: Git Configuration
        if: steps.pattern.outputs.deploys == 'true'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Delete Branch Extensions
        if: steps.pattern.outputs.deploys == 'true'
        run: rm -rf -- "./$DELETED_BRANCH"
      - name: Commit and Push
        if: steps.pattern.outputs.deploys == 'true'
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing to delete"
            exit 0
          fi
          git commit -m "Delete branch extensions"
          git pull --rebase
          git push origin gh-pages
