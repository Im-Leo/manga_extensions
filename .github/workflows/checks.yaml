name: Checks

on:
  pull_request:
  workflow_dispatch:
  # Also the gate in front of every deploy.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Inside a called workflow `github.workflow` is the caller's name, so this group
  # never collides with the caller's own.
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Conformance, Tests and Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Type Checks
        run: npm run tsc
      - name: Run Lint Checks
        run: npm run lint:check
      - name: Run Format Checks
        run: npm run format:check
      # Deterministic and network-free.
      - name: Run Offline Tests
        run: npm test
      - name: Bundle Extensions
        run: npm run bundle
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests.json
          path: bundles/tests.json
          retention-days: 14
