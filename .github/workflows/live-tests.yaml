name: Live Tests

on:
  # Live sources drift without any commit here, so they are polled on a
  # schedule. Daily rather than hourly: five scraped sites x 24 runs is enough
  # traffic from one IP to look like abuse, and site markup does not change that
  # fast.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational. A failure here means a site changed or blocked us, not that
    # the branch is broken — MangaKakalot's Cloudflare challenge fails from CI by
    # design. Read the artifact rather than the job status.
    continue-on-error: true
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Live Tests
        run: npm run test:live
      - name: Upload Live Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-live.json
          path: bundles/tests-live.json
          retention-days: 14
